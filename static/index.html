<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Loan Application Assistant</title>
<style>
  body { font-family: -apple-system, sans-serif; max-width: 480px; margin: 40px auto; padding: 0 16px; }
  #log { border: 1px solid #ddd; border-radius: 8px; padding: 12px; height: 380px; overflow-y: auto; margin-bottom: 12px; }
  .msg { margin: 8px 0; padding: 8px 12px; border-radius: 10px; max-width: 85%; }
  .user { background: #0a5; color: white; margin-left: auto; }
  .bot { background: #f1f1f1; color: #222; }
  .row { display: flex; gap: 8px; margin-bottom: 10px; }
  input[type=text] { flex: 1; padding: 8px; }
  button { padding: 8px 14px; cursor: pointer; }
</style>
</head>
<body>
<h2>Loan application assistant</h2>
<div id="log"></div>
<div class="row">
  <input type="text" id="msg" placeholder="Type your answer..." onkeydown="if(event.key==='Enter')send()">
  <button onclick="send()">Send</button>
</div>
<div class="row">
  <input type="file" id="file">
  <button onclick="upload()">Upload document</button>
</div>

<script>
// Replace with your deployed Cloud Run URL, e.g. https://loan-agent-xxxx-uc.a.run.app
const API_BASE = "REPLACE_WITH_YOUR_CLOUD_RUN_URL";
const sessionId = crypto.randomUUID();

function addMsg(text, cls) {
  const div = document.createElement("div");
  div.className = "msg " + cls;
  div.textContent = text;
  const log = document.getElementById("log");
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
}

async function send() {
  const input = document.getElementById("msg");
  const text = input.value.trim();
  if (!text) return;
  addMsg(text, "user");
  input.value = "";
  const form = new FormData();
  form.append("session_id", sessionId);
  form.append("message", text);
  const res = await fetch(API_BASE + "/api/chat", { method: "POST", body: form });
  const data = await res.json();
  addMsg(data.reply, "bot");
}

async function upload() {
  const fileInput = document.getElementById("file");
  if (!fileInput.files.length) return;
  const form = new FormData();
  form.append("session_id", sessionId);
  form.append("file", fileInput.files[0]);
  addMsg("Uploading document...", "user");
  const res = await fetch(API_BASE + "/api/upload", { method: "POST", body: form });
  const data = await res.json();
  const chatForm = new FormData();
  chatForm.append("session_id", sessionId);
  chatForm.append("message", "I uploaded a document: " + data.gcs_uri);
  const chatRes = await fetch(API_BASE + "/api/chat", { method: "POST", body: chatForm });
  const chatData = await chatRes.json();
  addMsg(chatData.reply, "bot");
}

addMsg("Hi! I can help you apply for a loan. What's your full name?", "bot");
</script>
</body>
</html>
