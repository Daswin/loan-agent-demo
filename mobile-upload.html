<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Photograph document</title>
  <style>
    :root { font-family: system-ui,sans-serif; color: #082e65; background: #f4f7fb; }
    * { box-sizing: border-box; }
    body { min-height: 100dvh; margin: 0; padding: max(24px,env(safe-area-inset-top)) 18px max(24px,env(safe-area-inset-bottom)); display: grid; place-items: center; background: linear-gradient(150deg,#fff,#edf4fc); }
    main { width: min(100%,440px); padding: 28px 22px; border: 1px solid #dce6f2; border-radius: 24px; background: rgba(255,255,255,.96); box-shadow: 0 20px 55px rgba(16,50,91,.14); }
    .brand { display: flex; align-items: center; gap: 10px; font-size: 1.1rem; font-weight: 750; }
    .mark { width: 34px; height: 22px; border-radius: 12px 3px; transform: skew(-18deg); background: linear-gradient(135deg,#39a7ef,#0a3d91); }
    h1 { margin: 28px 0 8px; font-family: Georgia,serif; font-size: 1.75rem; }
    p { color: #607593; line-height: 1.5; }
    .capture { display: block; margin: 24px 0 12px; padding: 18px; border: 2px dashed #8eb3e3; border-radius: 17px; color: #0c55b8; background: #f5f9ff; text-align: center; font-weight: 700; cursor: pointer; }
    input { position: absolute; width: 1px; height: 1px; opacity: 0; }
    button { width: 100%; padding: 13px; border: 0; border-radius: 12px; color: white; background: #155fc2; font-size: 1rem; font-weight: 700; }
    button:disabled { opacity: .45; }
    #preview { width: 100%; max-height: 330px; margin: 12px 0; border-radius: 14px; object-fit: contain; background: #eef2f7; }
    #status { min-height: 24px; margin-top: 14px; font-size: .9rem; }
    .success { color: #147344; }
    .error { color: #a42d35; }
  </style>
</head>
<body>
  <main>
    <div class="brand"><span class="mark" aria-hidden="true"></span>FirstBank</div>
    <h1>Photograph document</h1>
    <p id="instructions">Loading the secure upload session…</p>
    <label class="capture" for="camera-input">Open camera</label>
    <input id="camera-input" type="file" accept="image/*" capture="environment" disabled>
    <img id="preview" alt="Document photo preview" hidden>
    <button id="upload-btn" type="button" disabled>Upload photo</button>
    <p id="status" aria-live="polite"></p>
  </main>
  <script src="/application/config.js"></script>
  <script src="/application/mobile-upload.js"></script>
</body>
</html>
